<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Royal Flame</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-page">

  <div class="auth-bg"></div>
  <div class="auth-ambient-glow"></div>

  <div id="toast-container"></div>

  <div class="auth-card-container">

    <div class="auth-header">
      <div class="auth-crest">⚜️</div>

      <h1 class="auth-title">
        <span class="gold-text-glow">ROYAL FLAME</span>
      </h1>

      <p class="auth-subtitle">
        Create a new secure password
      </p>
    </div>

    <div style="text-align:center;margin-bottom:1.5rem;">
      <h2>
        Reset <span class="gold-text">Password</span>
      </h2>
    </div>

    <form id="reset-password-form" class="auth-form active">

      <div class="form-group">

        <label class="form-label">
          New Password
        </label>

        <div class="input-wrapper">

          <span class="input-icon">🔒</span>

          <input
            type="password"
            id="new-password"
            class="form-input"
            placeholder="Minimum 8 characters"
            required
          >

        </div>

      </div>

      <div class="form-group">

        <label class="form-label">
          Confirm Password
        </label>

        <div class="input-wrapper">

          <span class="input-icon">🛡️</span>

          <input
            type="password"
            id="confirm-password"
            class="form-input"
            placeholder="Re-enter your password"
            required
          >

        </div>

      </div>

      <button
        type="submit"
        class="btn btn-primary auth-submit-btn"
      >
        Reset Password
      </button>

    </form>

  </div>

  <script src="js/reset-password.js"></script>

</body>
</html>
